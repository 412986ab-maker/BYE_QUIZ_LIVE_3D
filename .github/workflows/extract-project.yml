name: Extract project archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract clean project
        run: |
          set -e
          test -f BYE_QUIZ_LIVE_3D_CLEAN.tar.gz
          mkdir -p .extract
          tar -xzf BYE_QUIZ_LIVE_3D_CLEAN.tar.gz -C .extract
          echo "Archive contents:"
          find .extract -maxdepth 3 -type f | sort | head -200

          # Move the actual project contents to repository root.
          shopt -s dotglob nullglob
          entries=(.extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            inner="${entries[0]}"
            cp -a "${inner}/." .
          else
            cp -a .extract/. .
          fi

          rm -rf .extract BYE_QUIZ_LIVE_3D_CLEAN.tar.gz
          find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -300

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract BYE QUIZ LIVE 3D project"
            git push
          fi
